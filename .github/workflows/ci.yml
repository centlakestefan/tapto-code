name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the binary with `git describe --tags`, which needs
          # the tags and the history between them. checkout's default is a
          # depth-1 clone with no tags fetched at all, so a release build here
          # would report a bare hash where it should name its version. Nothing
          # fails in that case, which is exactly why it would go unnoticed —
          # the smoke test below asserts the stamp instead.
          fetch-depth: 0

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # The windows-latest runner ships OpenSSL; point CMake at it. Adjust the
      # path here if a future runner image moves it.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./build/tapto-code version

          # The version stamp is only as good as the checkout it was taken
          # from, and a wrong one is silent: every trace would name a build
          # that cannot be found. "no-git" means the history or the tags did
          # not arrive.
          if ./build/tapto-code version | grep -q 'no-git'; then
            echo "::error::version stamp has no repository to describe"
            exit 1
          fi
